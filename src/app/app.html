<div class="min-h-screen bg-slate-50 flex">
  <aside class="w-64 shrink-0 bg-slate-950 text-slate-100 flex flex-col">
    <div class="px-6 py-6 flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-400 to-indigo-600 flex items-center justify-center shrink-0">
        <i class="pi pi-calendar text-white text-sm"></i>
      </div>
      <span class="text-[15px] font-semibold tracking-tight">Eventos &amp; Horarios</span>
    </div>

    <nav class="flex-1 px-3 py-2 flex flex-col gap-0.5">
      <a
        routerLink="/eventos"
        routerLinkActive="bg-white/10 text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="group flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-white/5 hover:text-slate-100 transition-colors duration-150"
      >
        <i class="pi pi-calendar text-[15px] w-4 text-center"></i>
        <span>Eventos</span>
      </a>
      <a
        routerLink="/personas"
        routerLinkActive="bg-white/10 text-white"
        class="group flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-white/5 hover:text-slate-100 transition-colors duration-150"
      >
        <i class="pi pi-users text-[15px] w-4 text-center"></i>
        <span>Personas</span>
      </a>
    </nav>

    <div class="px-6 py-4 text-[11px] text-slate-600">
      timetable
    </div>
  </aside>

  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
